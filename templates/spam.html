<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XTREME | Spam Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #000;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass {
      background: rgba(10, 10, 10, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    input[type=text], textarea, input[type=number] { 
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; transition: 0.2s;
    }
    input:focus, textarea:focus { border-color: rgba(255,255,255,0.5); }
    input[type=range] { accent-color: #fff; background: transparent; }
    ::-webkit-scrollbar { width: 0px; }
    textarea { resize: vertical; min-height: 80px; }
  </style>
</head>
  <!-- XTREME UI ENGINE handles nav, bg, watermark, etc. -->

  <main class="flex-1 overflow-auto p-4 md:p-8 z-10 flex flex-col gap-6">
    <div class="flex flex-col md:flex-row gap-6 w-full">
    <!-- Controls Section -->
    <div class="flex flex-col gap-6 w-full md:w-1/3">
      <div class="glass rounded-3xl p-6 flex flex-col gap-4">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-semibold tracking-wide text-white/80">Active Nodes</h2>
          <div class="flex gap-2">
            <button onclick="selAll()" class="text-[10px] uppercase font-bold px-3 py-1.5 bg-white/10 rounded-full hover:bg-white/20 transition">All</button>
            <button onclick="clrAll()" class="text-[10px] uppercase font-bold px-3 py-1.5 bg-white/10 rounded-full hover:bg-white/20 transition">None</button>
          </div>
        </div>
        <div class="flex flex-col gap-2 max-h-64 overflow-y-auto" id="tsel">
          <div class="text-sm text-white/50 text-center py-4">Loading...</div>
        </div>
      </div>

      <div class="glass rounded-3xl p-6">
        <h2 class="text-sm font-semibold tracking-wide text-white/80 mb-4">Spam Engine</h2>
        <div class="flex gap-3">
          <button onclick="act('start')" class="flex-1 px-4 py-4 rounded-2xl font-bold text-sm bg-white text-black hover:scale-[1.02] active:scale-[0.98] transition-transform shadow-[0_0_20px_rgba(255,255,255,0.3)]">ENGAGE SPAM</button>
          <button onclick="act('stop')" class="flex-1 px-4 py-4 rounded-2xl font-bold text-sm bg-red-500/20 text-red-400 border border-red-500/30 hover:scale-[1.02] active:scale-[0.98] transition-transform">HALT</button>
        </div>
        <button onclick="toggleLogs()" class="w-full mt-2 px-4 py-2 rounded-xl font-bold text-[10px] bg-white/5 text-white/50 hover:bg-white/10 hover:text-white transition-colors uppercase tracking-widest border border-white/5">Toggle Logs</button>
      </div>
    </div>

    <!-- Configuration Section -->
    <div class="flex-1 glass rounded-3xl p-6 md:p-8 flex flex-col overflow-hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-sm font-semibold tracking-wide text-white/80">Payload Configuration</h2>
        <button onclick="save()" class="px-4 py-2 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-xl text-xs font-bold uppercase hover:bg-blue-500/30 transition-colors">Save config</button>
      </div>

      <div class="flex flex-col gap-6 overflow-y-auto pr-2">
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Custom Message Payload</label>
          <textarea id="smsg" class="w-full px-5 py-4 rounded-2xl text-sm" placeholder="Leave blank to pull random lines from chat folder"></textarea>
        </div>
        
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Pulse Interval (Seconds)</label>
          <div class="flex items-center gap-4 bg-black/40 px-5 py-4 rounded-2xl border border-white/5">
            <input type="range" id="spd" min="0.5" max="30" step="0.5" value="5" class="flex-1" oninput="document.getElementById('sv').textContent=this.value+'s'">
            <span id="sv" class="mono text-sm font-bold w-12 text-right text-white/80">5s</span>
          </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Execution Limit</label>
            <div class="flex gap-2">
              <input type="number" id="cnt" class="w-full px-5 py-3 rounded-2xl text-sm" placeholder="Infinite">
              <button onclick="document.getElementById('cnt').value=''" class="px-5 rounded-2xl border border-white/10 hover:bg-white hover:text-black transition-colors font-mono text-xl text-white/50">∞</button>
            </div>
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Post-Catch Cooldown (s)</label>
            <input type="number" id="cool" class="w-full px-5 py-3 rounded-2xl text-sm" placeholder="3.0" step="0.5" min="0">
          </div>
        </div>
      </div>
    </div>
    </div>

    <!-- Logs Section -->
    <div id="logs-container" class="glass rounded-3xl p-6 flex flex-col h-80 relative transition-all duration-300" style="display: none;">
      <div class="flex items-center gap-3 mb-4 shrink-0">
        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        <h2 class="text-[10px] uppercase tracking-widest text-white/50 font-bold">Live Log Stream</h2>
        <div class="ml-auto flex gap-2">
          <button onclick="document.getElementById('logs').innerHTML=''" class="px-3 py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-[9px] font-bold uppercase hover:bg-red-500/30 transition-colors">Clear</button>
          <button onclick="toggleLogs()" class="px-3 py-1.5 bg-white/10 text-white/60 border border-white/20 rounded-lg text-[9px] font-bold uppercase hover:bg-white/20 hover:text-white transition-colors">Hide</button>
        </div>
      </div>
      <div id="logs" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-2 font-mono text-xs"></div>
    </div>

  </main>

  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-white/90 backdrop-blur-md text-black text-sm font-bold rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.5)] transition-all duration-300 transform translate-y-10 opacity-0 pointer-events-none z-50"></div>

  <script src="/static/xtreme_ui.js"></script>
  <script>
    function toast(m) {
      const t = document.getElementById('toast');
      t.textContent = m;
      t.classList.remove('translate-y-10', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-10', 'opacity-0'), 2500);
    }

    let tokens=[], sel=new Set(), firstLoad=true;
    
    async function load() {
      const [tl, d] = await Promise.all([fetch('/api/tokens').then(r=>r.json()), fetch('/api/data').then(r=>r.json())]);
      tokens = tl; const nodes = d.nodes||[];
      if (firstLoad && tl.length) {
        tl.forEach(t => sel.add(t.id));
        firstLoad = false;
      }
      
      const logEl = document.getElementById('logs');
      if (d.logs && document.getElementById('logs-container').style.display !== 'none') {
        logEl.innerHTML = d.logs.map(l => {
          let c = 'text-white/70 bg-white/5 border-transparent';
          if(l.type==='success') c='text-green-400 bg-green-950/30 border border-green-500/20';
          if(l.type==='error') c='text-red-400 bg-red-950/30 border border-red-500/20';
          if(l.type==='warning') c='text-yellow-400 bg-yellow-950/30 border border-yellow-500/20';
          return `<div class="p-3 rounded-xl ${c} whitespace-nowrap overflow-hidden text-ellipsis"><span class="text-white/30 mr-3">[${l.time}]</span>${l.message.replace(/</g,'&lt;')}</div>`;
        }).join('');
      }

      const envEl = document.getElementById('env-badge');
      if (envEl && d.environment) {
        envEl.textContent = d.environment;
        envEl.className = `text-[10px] px-2 py-0.5 rounded-full border ${d.environment==='Render'?'bg-blue-500/20 text-blue-400 border-blue-500/30':'bg-green-500/20 text-green-400 border-green-500/30'}`;
      }

      const el = document.getElementById('tsel');
      if(!tl.length) { el.innerHTML='<div class="text-sm text-white/50 text-center py-4">No nodes connected</div>'; return; }
      
      el.innerHTML = tl.map(t => {
        const n = nodes.find(x=>x.id===t.id)||{};
        const isSel = sel.has(t.id);
        return `
          <div onclick="tog('${t.id}')" class="flex items-center justify-between p-3 rounded-2xl cursor-pointer transition-all ${isSel?'bg-white/20 border border-white/40':'bg-black/40 border border-transparent'}">
            <div class="flex items-center gap-3">
              <div class="w-3 h-3 rounded-full border-2 ${isSel?'border-white bg-white':'border-white/30'}"></div>
              <span class="text-sm font-medium ${isSel?'text-white':'text-white/70'}">${t.label}</span>
            </div>
            <span class="text-[9px] uppercase tracking-widest px-2 py-1 rounded-full ${n.spamming?'bg-purple-500/20 text-purple-400':'bg-white/5 text-white/30'}">${n.spamming?'Spamming':'Standby'}</span>
          </div>
        `;
      }).join('');
    }

    function tog(id) { if(sel.has(id)) sel.delete(id); else sel.add(id); load(); }
    function selAll() { tokens.forEach(t=>sel.add(t.id)); load(); }
    function clrAll() { sel.clear(); load(); }

    function toggleLogs() {
      const lc = document.getElementById('logs-container');
      lc.style.display = lc.style.display === 'none' ? 'flex' : 'none';
      if (lc.style.display === 'flex') load();
    }

    async function act(a) {
      const ids = sel.size ? Array.from(sel) : 'all';
      await fetch('/api/spam/'+a, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids})});
      toast(a==='start'?'Spam Initialized':'Spam Halted'); load();
    }

    async function loadCfg() {
      const c = await fetch('/api/spam/config').then(r=>r.json());
      document.getElementById('smsg').value = c.message||'';
      document.getElementById('spd').value = c.speed||5;
      document.getElementById('sv').textContent = (c.speed||5)+'s';
      document.getElementById('cool').value = c.cooldown_after_catch||3;
      if(c.count !== 'infinity') document.getElementById('cnt').value = c.count;
    }

    async function save() {
      const cnt = document.getElementById('cnt').value.trim();
      await fetch('/api/spam/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
        message: document.getElementById('smsg').value.trim(),
        speed: parseFloat(document.getElementById('spd').value),
        count: cnt ? parseInt(cnt) : 'infinity',
        cooldown_after_catch: parseFloat(document.getElementById('cool').value)||3
      })});
      toast('Spam Configuration Saved');
    }

    load(); loadCfg(); setInterval(load, 3000);
  </script>
</body>
</html>
