<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XTREME | Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,900;1,400&family=Space+Grotesk:wght@300;400;700&family=JetBrains+Mono&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c1: #ff2d55;
      --c2: #0affe4;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #000;
    }

    /* ── CARD (New Era) ── */
    .card {
      background: #000;
      border: 1px solid rgba(255,255,255,.08);
      position: relative;
      overflow: hidden;
      transition: background .3s;
    }
    .card::before {
      content: ''; position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: var(--c1);
      transform: scaleX(0); transform-origin: left;
      transition: transform .4s cubic-bezier(.23,1,.32,1);
    }
    .card:hover { background: rgba(255,255,255,.03); }
    .card:hover::before { transform: scaleX(1); }

    /* ── SECTION LABEL ── */
    .section-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
      color: var(--c1); margin-bottom: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .section-label::after { content: ''; flex: 0 0 40px; height: 1px; background: var(--c1); }

    /* ── BUTTONS ── */
    .btn-primary {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; letter-spacing: .15em; text-transform: uppercase;
      color: #000; background: #fff;
      border: none; padding: 10px 22px;
      position: relative; overflow: hidden;
      transition: color .3s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer;
    }
    .btn-primary::before {
      content: ''; position: absolute; inset: 0;
      background: var(--c1); transform: translateX(-101%);
      transition: transform .35s cubic-bezier(.23,1,.32,1);
    }
    .btn-primary:hover::before { transform: translateX(0); }
    .btn-primary:hover { color: #fff; }
    .btn-primary span { position: relative; z-index: 1; }

    .btn-ghost {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; letter-spacing: .15em; text-transform: uppercase;
      color: rgba(255,255,255,.5); background: none;
      border: 1px solid rgba(255,255,255,.15);
      padding: 10px 22px; cursor: pointer;
      transition: color .2s, border-color .2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,.5); }

    .btn-danger {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--c1); background: none;
      border: 1px solid rgba(255,45,85,.3);
      padding: 8px 18px; cursor: pointer;
      transition: background .2s, color .2s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-danger:hover { background: rgba(255,45,85,.15); }

    /* ── INPUTS ── */
    input, select {
      font-family: 'Space Grotesk', sans-serif;
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(255,255,255,.1);
      color: #fff; outline: none;
      transition: border-color .2s;
    }
    input:focus, select:focus { border-color: var(--c1); }

    /* ── TOGGLE ── */
    .toggle-wrap { position: relative; }
    .toggle-wrap input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-track {
      display: flex; width: 40px; height: 22px; border-radius: 0;
      background: rgba(255,255,255,.1);
      position: relative; cursor: pointer; transition: background .2s;
      border: 1px solid rgba(255,255,255,.1);
    }
    .toggle-wrap input:checked + .toggle-track { background: var(--c1); border-color: var(--c1); }
    .toggle-track::after {
      content: ''; position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #fff; transition: left .2s;
    }
    .toggle-wrap input:checked + .toggle-track::after { left: calc(100% - 18px); }

    /* ── MONO ── */
    .mono { font-family: 'JetBrains Mono', monospace; }



    /* ── ENTRANCE ANIMATIONS ── */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim { animation: fadeSlideUp .6s cubic-bezier(.23,1,.32,1) both; opacity: 0; }

    /* ── LOG ENTRY ── */
    .log-entry {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; line-height: 1.6;
      border-left: 2px solid rgba(255,255,255,.1);
      padding: 4px 10px;
      color: rgba(255,255,255,.5);
    }
    .log-entry.err { border-color: var(--c1); color: rgba(255,100,100,.8); background: rgba(255,45,85,.04); }
    .log-entry.ok  { border-color: var(--c2); color: rgba(10,255,228,.7); background: rgba(10,255,228,.03); }

    /* ── STATUS DOT ── */
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }

    /* ── CAPTCHA ALERT ── */
    .captcha-banner {
      border: 1px solid var(--c1);
      border-left: 3px solid var(--c1);
      background: rgba(255,45,85,.05);
      padding: 16px 20px;
    }

    ::-webkit-scrollbar { width: 0px; }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <main class="flex-1 overflow-auto p-4 md:p-6 lg:p-10 flex flex-col gap-0 z-10 relative w-full max-w-[1600px] mx-auto">

    <!-- Captcha Alert -->
    <div id="captcha-alert" class="hidden w-full mb-6"></div>

    <!-- Header -->
    <div class="flex flex-col md:flex-row items-start md:items-end justify-between border-b border-white/10 pb-6 mb-8 gap-4 anim" style="animation-delay:.05s">
      <div>
        <div class="section-label">◈ Central Node Dashboard</div>
        <h1 style="font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,8vw,96px);line-height:.9;letter-spacing:.02em;">
          XTREME <em style="font-family:'Playfair Display',serif;font-style:italic;color:var(--c2);">COMMAND</em>
        </h1>
      </div>
      <div class="flex items-center gap-3">
        <a href="/data" class="btn-ghost" style="padding:10px 22px;font-size:12px;">◈ SCANNER</a>
        <div class="flex items-center gap-3 card px-5 py-3" style="min-width:180px;">
          <span style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);">Engine</span>
          <div class="flex items-center gap-2 ml-auto">
            <span id="status-dot" class="w-2 h-2 bg-green-400 pulse" style="box-shadow:0 0 8px currentColor;"></span>
            <span id="stxt" style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:#4ade80;">CONNECTING</span>
          </div>
        </div>
      </div>
    </div>



    <!-- Main Layout -->
    <div class="flex flex-col xl:flex-row gap-6 items-start">

      <!-- Left Column -->
      <div class="flex flex-col gap-4 w-full xl:w-[340px] shrink-0 xl:overflow-y-auto xl:max-h-[calc(100vh-260px)] pb-4 xl:pb-0 xl:pr-1">

        <!-- Identity / Profile Cards -->
        <div id="identity-section" class="flex flex-col gap-3"></div>

        <!-- Big Counters -->
        <div class="grid grid-cols-2 gap-0 anim" style="animation-delay:.15s;">
          <div class="card p-3 text-center border-r-0">
            <div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px;">◉ Caught</div>
            <div id="mc" style="font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;color:var(--c2);text-shadow:0 0 16px rgba(10,255,228,.25);">0</div>
          </div>
          <div class="card p-3 text-center">
            <div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px;">◈ Faults</div>
            <div id="mf" style="font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;color:var(--c1);text-shadow:0 0 16px rgba(255,45,85,.25);">0</div>
          </div>
        </div>

        <!-- Humanizer Panel -->
        <div class="card p-3 flex flex-col gap-3 anim" style="animation-delay:.2s;">
          <div class="flex items-center justify-between" style="border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:8px;">
            <div>
              <div class="section-label" style="margin-bottom:1px;font-size:10px;">◎ Humanizer</div>
              <p style="font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.08em;">Break timer &amp; jitter</p>
            </div>
            <label class="toggle-wrap">
              <input type="checkbox" id="break-enabled" onchange="saveBreak()">
              <div class="toggle-track"></div>
            </label>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div class="flex flex-col gap-1">
              <label style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);">Start (UTC)</label>
              <input type="text" id="break-time" value="02:00" onchange="saveBreak()"
                class="px-2 py-1.5 mono text-xs text-center font-bold" style="font-size:12px;">
            </div>
            <div class="flex flex-col gap-1">
              <label style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);">Duration (min)</label>
              <input type="number" id="break-dur" value="10" onchange="saveBreak()"
                class="px-2 py-1.5 mono text-xs text-center font-bold" style="font-size:12px;">
            </div>
          </div>
        </div>

        <!-- Treasury Vault -->
        <div class="card p-3 flex flex-col gap-2 anim" style="animation-delay:.25s;">
          <div class="flex items-center justify-between" style="border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:7px;">
            <div class="section-label" style="margin-bottom:0;font-size:10px;">⬡ Treasury Vault</div>
            <div class="flex items-center gap-2">
              <button onclick="syncBal()" class="btn-ghost" style="padding:4px 10px;font-size:9px;" title="Sync Balances">
                <svg id="sync-icon" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>Sync</span>
              </button>
              <a href="/bal" class="btn-ghost" style="padding:4px 10px;font-size:9px;">◈ Full</a>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-0">
            <div class="card p-2 text-center border-r-0">
              <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px;">Pokécoins</div>
              <div id="total-pk" class="mono" style="font-size:17px;font-weight:900;color:#facc15;">0</div>
            </div>
            <div class="card p-2 text-center">
              <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px;">Cowoncy</div>
              <div id="total-owo" class="mono" style="font-size:17px;font-weight:900;color:var(--c1);">0</div>
            </div>
          </div>
          <button onclick="toggleBalDetails()" class="btn-ghost w-full" style="font-size:9px;padding:5px;">◈ Node Breakdown</button>
          <div id="bal-details" class="hidden flex flex-col gap-1"></div>
        </div>

        <!-- Diagnostics -->
        <div class="card p-3 flex flex-col gap-0 anim" style="animation-delay:.3s;">
          <div class="section-label" style="margin-bottom:8px;font-size:10px;">◉ Diagnostics</div>
          <div id="system-summary-container" class="flex flex-col gap-0">
            <div class="flex items-center justify-between" style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);">
              <span style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);">Uptime</span>
              <span id="uptime" class="mono" style="font-size:11px;font-weight:700;color:var(--c2);">0s</span>
            </div>
            <div class="flex items-center justify-between" style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);">
              <span style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);">Heartbeats</span>
              <span id="pings" class="mono" style="font-size:11px;font-weight:700;color:var(--c2);">0</span>
            </div>
            <div class="flex items-center justify-between" style="padding:6px 0;">
              <span style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);">Requests</span>
              <span id="reqs" class="mono" style="font-size:11px;font-weight:700;color:var(--c2);">0</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Right Column -->
      <div class="flex-1 flex flex-col gap-4 min-w-0 xl:max-h-[calc(100vh-260px)] xl:overflow-hidden">

        <!-- Live Log Console -->
        <div id="console-container" class="card flex flex-col anim" style="animation-delay:.2s;height:350px;flex:1 1 auto;">
          <div class="flex items-center justify-between px-6 py-4" style="border-bottom:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.4);">
            <div class="flex items-center gap-3">
              <span class="w-2 h-2 pulse" style="background:var(--c2);box-shadow:0 0 8px var(--c2);"></span>
              <span style="font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--c2);">◈ Live Log Stream</span>
            </div>
            <div class="flex gap-2">
              <button onclick="reset()" class="btn-danger" style="font-size:10px;padding:6px 14px;">✕ Clear</button>
              <button id="tbtn" onclick="toggleConsole()" class="btn-ghost" style="padding:6px 12px;">
                <svg id="expand-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transition:transform .4s;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
              </button>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-1" id="logs"></div>
        </div>

        <!-- Active Nodes -->
        <div class="card p-0 flex flex-col anim" style="animation-delay:.3s;max-height:220px;">
          <div class="flex justify-between items-center px-6 py-4" style="border-bottom:1px solid rgba(255,255,255,.07);">
            <div class="section-label" style="margin-bottom:0;">◈ Active Nodes</div>
            <a href="/config" class="btn-primary" style="font-size:10px;padding:7px 16px;"><span>Manage</span></a>
          </div>
          <div class="flex flex-col gap-0 overflow-y-auto flex-1" id="nodes">
            <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center;padding:32px;">No Active Nodes</div>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script src="/static/xtreme_ui.js"></script>
  <script src="/static/fafnir_core.js"></script>
  <script>
    let lh = '';
    let isExpanded = false;
    let balExpanded = false;

    function toggleConsole() {
      const container = document.getElementById('console-container');
      const icon = document.getElementById('expand-icon');
      isExpanded = !isExpanded;
      if (isExpanded) {
        container.classList.add('fixed', 'inset-4', 'z-[2000000]');
        container.style.height = 'auto';
        icon.style.transform = 'rotate(180deg)';
      } else {
        container.classList.remove('fixed', 'inset-4', 'z-[2000000]');
        container.style.height = '350px';
        icon.style.transform = 'rotate(0deg)';
      }
    }

    function toggleBalDetails() {
      const det = document.getElementById('bal-details');
      balExpanded = !balExpanded;
      det.classList.toggle('hidden', !balExpanded);
    }

    function _setStatus(s) {
      const st = document.getElementById('stxt');
      const dot = document.getElementById('status-dot');
      if (!st) return;
      if (s === 'Online') {
        st.textContent = 'SYSTEM ONLINE'; st.style.color = '#4ade80';
        if (dot) { dot.style.background = '#4ade80'; dot.style.boxShadow = '0 0 8px #4ade80'; }
      } else if (s === 'Reconnecting') {
        st.textContent = 'RECONNECTING...'; st.style.color = '#facc15';
        if (dot) { dot.style.background = '#facc15'; dot.style.boxShadow = '0 0 8px #facc15'; }
      } else {
        st.textContent = 'OFFLINE'; st.style.color = 'var(--c1)';
        if (dot) { dot.style.background = 'var(--c1)'; dot.style.boxShadow = '0 0 8px var(--c1)'; }
      }
    }

    async function syncBal() {
      const btn = document.querySelector('[onclick="syncBal()"]');
      btn.disabled = true;
      const icon = document.getElementById('sync-icon');
      icon.style.animation = 'spin 1s linear infinite';
      try {
        await fetch('/api/balance/sync', { method: 'POST' });
        setTimeout(() => { btn.disabled = false; icon.style.animation = ''; }, 5000);
      } catch (e) { btn.disabled = false; icon.style.animation = ''; }
    }

    async function poll() {
      try {
        const [dr, mr] = await Promise.all([fetch('/api/data'), fetch('/api/metrics')]);
        const d = await dr.json();
        const m = await mr.json();

        _setStatus(d.status === 'Offline' ? 'Offline' : 'Online');
        document.getElementById('mc').textContent = d.caught ?? 0;
        document.getElementById('mf').textContent = d.faults ?? 0;
        document.getElementById('uptime').textContent = m.uptime || 'N/A';
        document.getElementById('pings').textContent = m.pings || 0;
        document.getElementById('reqs').textContent = m.reqs || m.requests || 0;

        const nodes = d.nodes || [];
        let totalPk = 0, totalOwo = 0;
        const tokens = d.tokens || [];
        tokens.forEach(t => {
          const n = nodes.find(n => n.id === t.id);
          totalPk  += n?.balances?.pokecoins ?? t.balances?.pokecoins ?? 0;
          totalOwo += n?.balances?.cowoncy   ?? t.balances?.cowoncy   ?? 0;
        });
        document.getElementById('total-pk').textContent  = totalPk.toLocaleString();
        document.getElementById('total-owo').textContent = totalOwo.toLocaleString();

        const balDet = document.getElementById('bal-details');
        balDet.innerHTML = tokens.map(t => {
          const n = nodes.find(n => n.id === t.id);
          const pk  = n?.balances?.pokecoins ?? t.balances?.pokecoins ?? 0;
          const owo = n?.balances?.cowoncy   ?? t.balances?.cowoncy   ?? 0;
          return `<div class="flex justify-between items-center" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);">
            <span style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);">${t.label}</span>
            <div class="flex gap-3 mono">
              <span style="font-size:10px;font-weight:700;color:#facc15;">${pk.toLocaleString()} PC</span>
              <span style="font-size:10px;font-weight:700;color:var(--c1);">${owo.toLocaleString()} owo</span>
            </div>
          </div>`;
        }).join('');

        // Identity section
        const idSection = document.getElementById('identity-section');
        const profiles = nodes.filter(n => n.profile?.username);
        idSection.innerHTML = profiles.map(n => `
          <div class="card flex items-center gap-3 p-4">
            <img src="${n.profile.avatar}" class="w-10 h-10 object-cover border border-white/10" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" style="flex-shrink:0;">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center">
                <span style="font-family:'Dancing Script',cursive;font-size:15px;font-weight:700;color:#fff;">${n.profile.username}</span>
                <div class="flex items-center gap-1" style="background:rgba(10,255,228,.1);border:1px solid rgba(10,255,228,.25);padding:2px 8px;">
                  <span class="w-1.5 h-1.5 pulse" style="background:var(--c2);border-radius:50%;"></span>
                  <span style="font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--c2);">Active</span>
                </div>
              </div>
              <div style="font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${n.profile.bio || 'Node Initialized.'}</div>
            </div>
          </div>`).join('');

        // Nodes compact list
        const ne = document.getElementById('nodes');
        if (!nodes.length) {
          ne.innerHTML = '<div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center;padding:32px;">No Active Nodes</div>';
        } else {
          ne.innerHTML = nodes.map(n => `
            <div class="flex items-center justify-between px-6 py-3" style="border-bottom:1px solid rgba(255,255,255,.05);">
              <div class="flex items-center gap-3">
                <img src="${n.profile?.avatar||''}" class="w-7 h-7 object-cover border border-white/10" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <div>
                  <div style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:#fff;">${n.profile?.username || n.label}</div>
                  <div class="mono" style="font-size:9px;color:rgba(255,255,255,.35);">CH: ${n.channel_id||'Global'}</div>
                </div>
              </div>
              <div class="flex gap-2 items-center">
                <span style="width:6px;height:6px;border-radius:50%;background:${n.catching?'var(--c2)':'rgba(255,255,255,.12)'};box-shadow:${n.catching?'0 0 6px var(--c2)':''}" title="Catching"></span>
                <span style="width:6px;height:6px;border-radius:50%;background:${n.spamming?'#a855f7':'rgba(255,255,255,.12)'};box-shadow:${n.spamming?'0 0 6px #a855f7':''}" title="Spam"></span>
                <span style="width:6px;height:6px;border-radius:50%;background:${n.owo_running?'var(--c1)':'rgba(255,255,255,.12)'};box-shadow:${n.owo_running?'0 0 6px var(--c1)':''}" title="OwO"></span>
                <span class="mono" style="font-size:9px;font-weight:700;color:#facc15;margin-left:6px;">${(n.balances?.pokecoins||0).toLocaleString()} PC</span>
              </div>
            </div>`).join('');
        }

        // Logs
        const logs = d.logs || [];
        const h = logs.slice(0, 5).map(l => l.message + l.time).join('|');
        if (h !== lh) {
          lh = h;
          document.getElementById('logs').innerHTML = logs.map(l => {
            const isErr = l.type === 'error' || l.type === 'warning';
            const isOk  = l.type === 'catch'  || l.type === 'success';
            return `<div class="log-entry ${isErr?'err':isOk?'ok':''}">
              <span style="color:rgba(255,255,255,.3);">[${l.time}]</span> ${l.message}
            </div>`;
          }).join('');
        }

        // Captcha
        const captchaNodes = nodes.filter(n => n.captcha_detected);
        const captchaAlert = document.getElementById('captcha-alert');
        if (captchaNodes.length > 0) {
          let html = `<div class="captcha-banner flex flex-col gap-3">
            <div class="flex items-center gap-3">
              <span style="width:8px;height:8px;background:var(--c1);border-radius:50%;animation:pulse 1s infinite;"></span>
              <span style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.1em;color:var(--c1);">◈ Captcha Wall Detected</span>
            </div>
            <div class="flex flex-col gap-2">`;
          captchaNodes.forEach(node => {
            html += `<div class="flex justify-between items-center" style="padding:8px 0;border-bottom:1px solid rgba(255,45,85,.15);">
              <span style="font-size:12px;font-weight:700;color:var(--c1);">${node.label || node.id}</span>
              <div class="flex gap-2">
                <a href="${node.captcha_url||'#'}" target="_blank" class="btn-primary" style="font-size:10px;padding:6px 14px;"><span>Solve</span></a>
                <button onclick="resumeTokenCaptcha('${node.id}')" class="btn-ghost" style="font-size:10px;padding:6px 14px;">Resume</button>
              </div>
            </div>`;
          });
          html += `</div><button onclick="dismissCaptcha()" style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);background:none;border:none;cursor:pointer;margin-top:4px;">✕ Dismiss</button></div>`;
          captchaAlert.innerHTML = html;
          captchaAlert.classList.remove('hidden');
        } else {
          captchaAlert.classList.add('hidden');
        }

        // Diagnostics grid update
        const activeSpam  = nodes.filter(n => n.spamming).length;
        const activeOwo   = nodes.filter(n => n.owo_running).length;
        const activeCatch = nodes.filter(n => n.catching).length;
        let detSum = document.getElementById('det-sum');
        if (!detSum) {
          detSum = document.createElement('div');
          detSum.id = 'det-sum';
          document.getElementById('system-summary-container').appendChild(detSum);
        }
        detSum.innerHTML = `<div class="grid grid-cols-4 gap-0 mt-3">
          ${[['Nodes',nodes.length,'#fff'],['Catch',activeCatch,'var(--c2)'],['Spam',activeSpam,'#a855f7'],['OwO',activeOwo,'var(--c1)']].map(([l,v,c]) =>
            `<div class="card text-center p-3 border-r-0 last:border-r">
              <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);">${l}</div>
              <div class="mono" style="font-size:20px;font-weight:900;color:${c};">${v}</div>
            </div>`).join('')}
        </div>`;

      } catch (e) {
        console.warn('poll error:', e);
        _setStatus('Reconnecting');
      }
    }

    async function loadBreak() {
      try {
        const cfg = await fetch('/api/break/config').then(r => r.json());
        document.getElementById('break-enabled').checked = cfg.enabled;
        document.getElementById('break-time').value = cfg.start_time;
        document.getElementById('break-dur').value = cfg.duration;
      } catch(e) {}
    }

    async function saveBreak() {
      await fetch('/api/break/config', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          enabled:    document.getElementById('break-enabled').checked,
          start_time: document.getElementById('break-time').value,
          duration:   parseInt(document.getElementById('break-dur').value)
        })
      });
    }

    async function dismissCaptcha() {
      document.getElementById('captcha-alert').classList.add('hidden');
      await fetch('/api/captcha/clear', { method: 'POST' }); poll();
    }
    async function resumeTokenCaptcha(tid) {
      await fetch(`/api/captcha/clear/${tid}`, { method: 'POST' }); poll();
    }
    async function reset() { await fetch('/api/reset', { method: 'POST' }); }

    loadBreak();
    setInterval(poll, 2000); poll();
  </script>
</body>
</html>
