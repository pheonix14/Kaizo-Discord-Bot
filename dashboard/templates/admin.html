{% extends "base.html" %}

{% block page_title %}SYSTEM INITIALIZATION{% endblock %}

{% block content %}
<style>
    .tactical-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -1;
        pointer-events: none;
    }
    
    .glow-panel {
        background: rgba(15, 17, 23, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glow-panel:hover {
        border-color: rgba(99, 102, 241, 0.3);
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.1);
    }

    .node-status {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 12px;
        box-shadow: 0 0 10px currentColor;
    }

    .terminal-output {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        background: #050505;
        border: 1px solid rgba(255, 255, 255, 0.03);
        padding: 1.5rem;
        height: 500px;
        overflow-y: auto;
        color: #10b981;
        font-size: 0.85rem;
        line-height: 1.6;
    }

    .hud-label {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.3);
        text-transform: uppercase;
        margin-bottom: 1rem;
    }

    .btn-action {
        width: 100%;
        padding: 1rem;
        background: transparent;
        border: 1px solid rgba(99, 102, 241, 0.5);
        color: #6366f1;
        font-weight: 800;
        letter-spacing: 0.2em;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
    }

    .btn-action:hover {
        background: #6366f1;
        color: black;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
    }

    .scanline {
        position: absolute;
        top: 0; left: 0; right: 0; height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(99, 102, 241, 0.05), transparent);
        animation: scanline 8s linear infinite;
        pointer-events: none;
    }
</style>

<div class="tactical-grid"></div>

<div class="container" style="display: grid; grid-template-columns: 1fr 2fr; gap: 2.5rem; position: relative;">
    <!-- LEFT PANEL: NODE CONTROL -->
    <div class="space-y-8">
        <div class="glow-panel p-8">
            <div class="scanline"></div>
            <div class="hud-label">Deploy New Infrastructure</div>
            
            <div class="space-y-4">
                <input type="text" id="botId" placeholder="NODE_ID" style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); color: white; font-family: monospace;">
                <input type="password" id="botToken" placeholder="ACCESS_TOKEN" style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); color: white; font-family: monospace;">
                <button onclick="deployBot()" class="btn-action">Initialize Cluster</button>
            </div>
        </div>

        <div class="glow-panel p-8">
            <div class="hud-label">Active Operational Nodes</div>
            <div id="botList" class="space-y-4">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: LIVE MATRIX -->
    <div class="glow-panel p-8">
        <div class="flex justify-between items-center mb-6">
            <div class="hud-label">Live Matrix Feed: <span id="currentConsoleTarget" style="color: #6366f1;">NONE</span></div>
            <div class="text-[10px] font-mono text-gray-600">ENCRYPTION: AES_256</div>
        </div>
        
        <div id="consoleOutput" class="terminal-output custom-scrollbar">
            [SYSTEM] Awaiting Node selection...
        </div>
    </div>
</div>

<script>
    let currentViewingBot = null;

    async function fetchBots() {
        const res = await fetch('/api/bots');
        const data = await res.json();
        const list = document.getElementById('botList');
        list.innerHTML = '';
        
        for (const [id, info] of Object.entries(data)) {
            const item = document.createElement('div');
            item.className = 'glow-panel p-4 flex justify-between items-center cursor-pointer hover:bg-white/[0.02]';
            if (currentViewingBot === id) item.style.borderColor = '#6366f1';

            item.innerHTML = `
                <div class="flex items-center">
                    <span class="node-status" style="color: ${info.running ? '#10b981' : '#ef4444'}"></span>
                    <span style="font-family: monospace; font-size: 13px; font-weight: 600; letter-spacing: 1px;">${id}</span>
                </div>
                <div style="font-size: 9px; font-weight: 800; color: ${info.running ? '#10b981' : '#666'}">
                    ${info.running ? 'ONLINE' : 'OFFLINE'}
                </div>
            `;
            item.onclick = () => viewConsole(id);
            list.appendChild(item);
        }
    }

    async function deployBot() {
        const id = document.getElementById('botId').value;
        const token = document.getElementById('botToken').value;
        if(!id || !token) return alert("All authorization fields required.");
        
        await fetch('/api/bots/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, token})
        });
        
        document.getElementById('botId').value = '';
        document.getElementById('botToken').value = '';
        fetchBots();
    }

    function viewConsole(id) {
        currentViewingBot = id;
        document.getElementById('currentConsoleTarget').innerText = id;
        fetchBots();
    }

    async function updateConsole() {
        if (!currentViewingBot) return;
        const res = await fetch(`/api/logs/${currentViewingBot}`);
        const data = await res.json();
        const consoleBox = document.getElementById('consoleOutput');
        consoleBox.innerText = data.logs;
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    setInterval(fetchBots, 3000);
    setInterval(updateConsole, 2000);
    fetchBots();
</script>
{% endblock %}
