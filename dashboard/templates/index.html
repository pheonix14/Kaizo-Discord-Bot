{% extends "base.html" %}

{% block page_title %}Core Monitor{% endblock %}

{% block content %}
<div class="container" style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
    <!-- Controls Panel -->
    <div class="glass-card">
        <h2>Deploy Instance</h2>
        <p class="subtitle">Launch a new bot node.</p>
        
        <input type="text" id="botId" placeholder="Unique Bot Name" style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; margin-bottom: 1rem;">
        <input type="password" id="botToken" placeholder="Discord Token" style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; margin-bottom: 1rem;">
        
        <button onclick="deployBot()" class="btn-primary" style="width: 100%;">DEPLOY SYSTEM</button>

        <h2 style="margin-top: 3rem;">Active Nodes</h2>
        <div id="botList">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Console Panel -->
    <div class="glass-card">
        <h2>Live Matrix: <span id="currentConsoleTarget" style="color: #6366f1;">None</span></h2>
        <p class="subtitle">Real-time bot logs and events.</p>
        
        <div id="consoleOutput" style="background: #000; padding: 1.5rem; border-radius: 12px; height: 500px; overflow-y: auto; font-family: monospace; color: #10b981; white-space: pre-wrap; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05);">
            Select a node to begin monitoring...
        </div>
    </div>
</div>

<script>
    let currentViewingBot = null;

    async function fetchBots() {
        const res = await fetch('/api/bots');
        const data = await res.json();
        const list = document.getElementById('botList');
        list.innerHTML = '';
        
        for (const [id, info] of Object.entries(data)) {
            const item = document.createElement('div');
            item.style.padding = '1rem';
            item.style.background = 'rgba(255,255,255,0.02)';
            item.style.borderRadius = '12px';
            item.style.marginBottom = '0.8rem';
            item.style.border = '1px solid rgba(255,255,255,0.05)';
            item.style.cursor = 'pointer';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.style.alignItems = 'center';
            
            if (currentViewingBot === id) item.style.borderColor = '#6366f1';

            item.innerHTML = `
                <div>
                    <span style="width: 10px; height: 10px; background: ${info.running ? '#10b981' : '#ef4444'}; border-radius: 50%; display: inline-block; margin-right: 10px;"></span>
                    <strong>${id}</strong>
                </div>
                <div style="font-size: 0.7rem; opacity: 0.5;">
                    ${info.running ? 'ONLINE' : 'OFFLINE'}
                </div>
            `;
            item.onclick = () => viewConsole(id);
            list.appendChild(item);
        }
    }

    async function deployBot() {
        const id = document.getElementById('botId').value;
        const token = document.getElementById('botToken').value;
        if(!id || !token) return alert("All fields required.");
        
        await fetch('/api/bots/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, token})
        });
        
        document.getElementById('botId').value = '';
        document.getElementById('botToken').value = '';
        fetchBots();
    }

    function viewConsole(id) {
        currentViewingBot = id;
        document.getElementById('currentConsoleTarget').innerText = id;
        fetchBots();
    }

    async function updateConsole() {
        if (!currentViewingBot) return;
        const res = await fetch(`/api/logs/${currentViewingBot}`);
        const data = await res.json();
        const consoleBox = document.getElementById('consoleOutput');
        consoleBox.innerText = data.logs;
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    setInterval(fetchBots, 3000);
    setInterval(updateConsole, 2000);
    fetchBots();
</script>
{% endblock %}
