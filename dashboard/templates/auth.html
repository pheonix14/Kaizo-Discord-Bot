<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIZER X - ACCESS GRANTED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: #050507;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        /* Animated Grid Background */
        .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-50%);
            animation: grid-move 20s linear infinite;
            z-index: 0;
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(-50%); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(-40%); }
        }

        .login-card {
            background: rgba(15, 15, 20, 0.8);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 450px;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.2);
            animation: card-entry 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes card-entry {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .subtitle {
            color: #6366f1;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 1.2rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-size: 1rem;
        }

        input:focus {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        button {
            width: 100%;
            padding: 1.2rem;
            background: #6366f1;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1rem;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .footer-links {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Scanline Effect */
        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="scanline"></div>

    <form class="login-card" method="POST">
        <div class="logo">KAIZER X</div>
        <div class="subtitle">Secure Node Entry</div>

        {% if error %}
        <div class="error" style="display: block;">{{ error }}</div>
        {% endif %}

        <div class="input-group">
            <input type="text" name="username" placeholder="IDENTIFICATION ID" required autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="ACCESS KEYCODE" required>
        </div>

        <button type="submit">INITIALIZE LOGIN</button>

        <div class="footer-links">
            <span>ENCRYPTED_SESSION: AES-256</span>
            <span>NODE_ID: 101-X</span>
        </div>
    </form>

    <script>
        // Subtle Mouse Follow Parallax for card
        const card = document.querySelector('.login-card');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateX(${-y}deg) rotateY(${x}deg)`;
        });
    </script>
</body>
</html>
