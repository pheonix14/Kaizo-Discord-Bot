<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIZER X - Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: #0d0e12;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: rgba(15, 17, 23, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #6366f1, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: #6366f1;
        }

        .nav-item i { margin-right: 15px; font-size: 1.2rem; }

        /* Main Content Area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 3rem;
            background: radial-gradient(circle at 0% 0%, #16181d 0%, #0d0e12 100%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .user-badge {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        h2 { font-weight: 800; font-size: 1.8rem; margin-bottom: 0.5rem; }
        p.subtitle { color: rgba(255, 255, 255, 0.4); margin-bottom: 2rem; }

        .btn-primary {
            padding: 0.8rem 1.5rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3); }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { width: 80px; padding: 2rem 0.5rem; }
            .sidebar span { display: none; }
            .nav-item i { margin-right: 0; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="sidebar">
        <a href="http://localhost:3000" style="text-decoration: none;">
            <div class="logo">KAIZER X</div>
        </a>
        
        <a href="/" class="nav-item {{ 'active' if request.path == '/' }}">
            <i class="fas fa-microchip"></i> <span>Core Monitor</span>
        </a>
        <a href="/manage/moderation" class="nav-item {{ 'active' if request.path == '/manage/moderation' }}">
            <i class="fas fa-shield-halved"></i> <span>Moderation</span>
        </a>
        <a href="/manage/economy" class="nav-item {{ 'active' if request.path == '/manage/economy' }}">
            <i class="fas fa-coins"></i> <span>Economy</span>
        </a>
        <a href="/manage/media" class="nav-item {{ 'active' if request.path == '/manage/media' }}">
            <i class="fas fa-play"></i> <span>Media Center</span>
        </a>
        <a href="/tickets" class="nav-item">
            <i class="fas fa-ticket"></i> <span>Tickets</span>
        </a>

        <div style="margin-top: auto;">
            <a href="/logout" class="nav-item" style="color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </a>
        </div>
    </nav>

    <main class="main-content">
        <header>
            <div>
                <h1 style="font-weight: 800; font-size: 2.2rem;">{% block page_title %}Dashboard{% endblock %}</h1>
            </div>
            <div class="user-badge">
                <span style="width: 10px; height: 10px; background: #10b981; border-radius: 50%; margin-right: 10px;"></span>
                {{ session.role or 'ADMIN' }}
            </div>
        </header>

        {% block content %}{% endblock %}
    </main>

</body>
</html>
