<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAFNIR | Catch History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      background-color: #000;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .glass {
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    ::-webkit-scrollbar {
      width: 0px;
    }

    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .filter-btn {
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 1);
      color: #000;
      font-weight: 700;
    }
  </style>
</head>

<body class="flex flex-col h-screen">

  <div id="bg-overlay" class="absolute inset-0 bg-black/60 -z-10"></div>

  <div id="captcha-alert" class="hidden fixed top-24 left-1/2 -translate-x-1/2 z-[5000] w-full max-w-xl px-4">
    <div class="glass border-2 border-red-500 rounded-3xl p-6 bg-red-500/20 backdrop-blur-3xl shadow-[0_0_50px_rgba(239,68,68,0.4)] flex flex-col items-center gap-4 text-center animate-pulse">
        <div class="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <div>
            <h2 class="text-xl font-black text-white uppercase tracking-tighter">⚠️ Captcha Wall Detected</h2>
            <p id="captcha-token-label" class="text-xs text-red-300 font-bold uppercase tracking-widest mt-1">Token on Standby</p>
            <p class="text-[10px] text-white/50 uppercase font-bold tracking-widest mt-1">All loops halted • Manual resolution required</p>
        </div>
        <a id="captcha-link" href="#" target="_blank" class="w-full bg-white text-black py-4 rounded-2xl font-black uppercase tracking-widest text-sm hover:scale-[1.02] active:scale-95 transition-all shadow-xl">🔗 Solve Captcha Now</a>
        <button onclick="dismissCaptcha()" class="text-[10px] text-white/30 uppercase font-bold hover:text-white transition-colors">Mark Resolved &amp; Dismiss</button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="glass px-6 py-4 flex items-center justify-between shrink-0 z-10 mx-4 mt-4 rounded-2xl">
    <div class="flex items-center gap-6 overflow-x-auto no-scrollbar w-full">
      <h1 class="text-xl font-bold tracking-tight shrink-0">FAFNIR</h1>
      <div class="flex gap-4">
        <a href="/"
          class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Home</a>
        <a href="/config"
          class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Tokens</a>
        <a href="/history"
          class="text-white font-medium text-sm whitespace-nowrap px-3 py-1 bg-white/10 rounded-full">History</a>
        <a href="/owo"
          class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">OwO</a>
        <a href="/slash"
          class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Slash</a>
        <a href="/spam"
          class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Spam</a>
        <a href="/image"
          class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Image</a>
        <a href="/hook"
          class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Hook</a>
      </div>
    </div>
  </nav>

  <!-- Filter Bar -->
  <div class="z-10 mx-4 mt-4 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex gap-2 bg-white/5 p-1 rounded-full border border-white/10 overflow-x-auto no-scrollbar max-w-full">
      <button onclick="setFilter('all')" id="btn-all"
        class="filter-btn active px-5 py-2 rounded-full text-xs uppercase tracking-widest text-white/60 hover:text-white whitespace-nowrap">All</button>
      <button onclick="setFilter('caught')" id="btn-caught"
        class="filter-btn px-5 py-2 rounded-full text-xs uppercase tracking-widest text-white/60 hover:text-white whitespace-nowrap">Caught</button>
      <button onclick="setFilter('failed')" id="btn-failed"
        class="filter-btn px-5 py-2 rounded-full text-xs uppercase tracking-widest text-white/60 hover:text-white whitespace-nowrap">Failed</button>
      <button onclick="setFilter('rare')" id="btn-rare"
        class="filter-btn px-5 py-2 rounded-full text-xs uppercase tracking-widest text-white/60 hover:text-white whitespace-nowrap">Rare</button>
      <button onclick="setFilter('shiny')" id="btn-shiny"
        class="filter-btn px-5 py-2 rounded-full text-xs uppercase tracking-widest text-white/60 hover:text-white whitespace-nowrap">Shiny</button>
    </div>

    <div class="flex items-center gap-4">
      <div id="stats"
        class="text-xs font-medium text-white/50 mono tracking-wider bg-black/40 px-4 py-2 rounded-xl border border-white/5">
        LOADING...
      </div>
      <button onclick="clearHistory()"
        class="px-5 py-2 rounded-full bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 text-xs font-bold uppercase tracking-widest transition-colors whitespace-nowrap">Clear
        Data</button>
    </div>
  </div>

  <!-- Grid -->
  <main class="flex-1 overflow-y-auto p-4 z-10">
    <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
      <div class="col-span-full text-center text-white/40 py-20 text-sm tracking-widest uppercase">Loading Pokédex...
      </div>
    </div>
    <div id="pager" class="flex justify-center gap-2 mt-8 mb-10 flex-wrap"></div>
  </main>

  <script src="/static/luxury_theme.js"></script>
  <script src="/static/fafnir_core.js"></script>
  <script>
    let curFilter = 'all';
    let curPage = 1;
    const PER_PAGE = 50;
    let _allItems = [];

    function imgUrl(item) {
      if (item.is_captcha) return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';
      const name = (item.pokemon_name || item.display_name || '').toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '');
      if (name) return `/static/pokemon/${name}.png`;
      return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';
    }

    function handleImgErr(el, item) {
      const name = (item.pokemon_name || item.display_name || '').toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '');
      const urls = [];
      if (item.pokemon_id) {
        urls.push(`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${item.pokemon_id}.png`);
      }
      if (name) {
        urls.push(`https://img.pokemondb.net/sprites/home/normal/${name}.png`);
      }
      urls.push('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png');

      let i = 0;
      el.onerror = () => {
        if (i < urls.length) el.src = urls[i++];
        else el.onerror = null;
      };
      if (i < urls.length) el.src = urls[i++];
    }

    function buildCard(item) {
      const name = item.display_name || item.pokemon_name || 'Unknown';
      const isCaught = item.success && !item.is_captcha;
      const isShiny = item.is_shiny;
      const isRare = ['legendary', 'mythical', 'ultra_beast'].includes(item.rarity);

      if (item.is_captcha) {
        return `
          <div class="glass rounded-2xl overflow-hidden card-hover border-red-500/50 flex flex-col items-center justify-center p-6 gap-4 text-center">
             <div class="w-16 h-16 animate-pulse">
                <img src="${imgUrl(item)}" class="w-full h-full object-contain opacity-80">
             </div>
             <div>
                <h3 class="text-red-400 font-bold tracking-widest text-xs uppercase mb-1">Captcha Active</h3>
                <p class="text-white/40 text-[10px] mono">${item.time || ''}</p>
             </div>
             <a href="${item.captcha_url || '#'}" target="_blank" class="mt-2 w-full py-2 rounded-xl bg-red-500/20 text-red-300 font-bold text-[10px] uppercase tracking-widest hover:bg-red-500/30 transition border border-red-500/30">Solve Now</a>
          </div>`;
      }

      const borderColor = isShiny ? 'border-yellow-500/40' : (isRare ? 'border-purple-500/40' : (isCaught ? 'border-green-500/20' : 'border-red-500/20'));
      const bgImgColor = isCaught ? 'bg-white/5' : 'bg-red-950/20';
      const imgClass = isCaught ? 'opacity-100' : 'opacity-40 grayscale';

      return `
      <div class="glass rounded-2xl overflow-hidden card-hover flex flex-col ${borderColor}">
        <div class="relative h-32 ${bgImgColor} flex items-center justify-center p-4">
          ${isShiny ? '<span class="absolute top-2 right-2 bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 px-2 py-0.5 rounded text-[9px] font-bold tracking-widest uppercase">Shiny</span>' : ''}
          ${!isShiny && isRare ? '<span class="absolute top-2 right-2 bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded text-[9px] font-bold tracking-widest uppercase">Rare</span>' : ''}
          
          <img src="${imgUrl(item)}" onerror="handleImgErr(this, ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="w-full h-full object-contain drop-shadow-lg ${imgClass}" alt="${name}">
        </div>
        
        <div class="p-4 flex flex-col gap-1">
          <h3 class="font-bold text-white tracking-wide truncate">${name}</h3>
          <div class="flex justify-between items-center mt-1">
             <span class="text-[10px] font-bold uppercase tracking-widest ${isCaught ? 'text-green-400' : 'text-red-400'}">${isCaught ? 'CAUGHT' : 'FAILED'}</span>
             <span class="text-[10px] mono text-white/40">${item.time || ''}</span>
          </div>
        </div>
      </div>`;
    }

    async function loadData() {
      try {
        const r = await window.Fafnir.safeFetch(`/api/history?page=1&per=200`);
        _allItems = r.items || [];
        render();

        // Check for captcha status from /api/data
        const d = await window.Fafnir.safeFetch('/api/data');
        const captchaData = d.captcha;
        const captchaAlert = document.getElementById('captcha-alert');
        if (captchaData && captchaData.url) {
            document.getElementById('captcha-link').href = captchaData.url;
            document.getElementById('captcha-token-label').textContent =
                `Token on standby: ${captchaData.label} • Detected at ${captchaData.time}`;
            captchaAlert.classList.remove('hidden');
        } else {
            captchaAlert.classList.add('hidden');
        }
      } catch (e) {
        console.error("Failed to load history", e);
      }
    }

    function setFilter(f) {
      curFilter = f;
      curPage = 1;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${f}`).classList.add('active');
      render();
    }

    function render() {
      let items = [..._allItems];

      // Filter logic
      if (curFilter === 'caught') items = items.filter(i => i.success && !i.is_captcha);
      else if (curFilter === 'failed') items = items.filter(i => !i.success && !i.is_captcha);
      else if (curFilter === 'rare') items = items.filter(i => ['legendary', 'mythical', 'ultra_beast'].includes(i.rarity));
      else if (curFilter === 'shiny') items = items.filter(i => i.is_shiny);

      // Stats
      const c = _allItems.filter(i => i.success && !i.is_captcha).length;
      const f = _allItems.filter(i => !i.success && !i.is_captcha).length;
      document.getElementById('stats').innerHTML = `TOTAL: <span class="text-white">${_allItems.length}</span> &nbsp;|&nbsp; CAUGHT: <span class="text-green-400">${c}</span>`;

      // Paging
      const totalPages = Math.max(1, Math.ceil(items.length / PER_PAGE));
      if (curPage > totalPages) curPage = 1;
      const slice = items.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);

      const grid = document.getElementById('grid');
      if (!slice.length) {
        grid.innerHTML = '<div class="col-span-full text-center text-white/40 py-20 text-sm tracking-widest uppercase">No Pokémon Found</div>';
        document.getElementById('pager').innerHTML = '';
        return;
      }

      grid.innerHTML = slice.map(buildCard).join('');

      // Render Pager
      const pager = document.getElementById('pager');
      if (totalPages <= 1) {
        pager.innerHTML = '';
        return;
      }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        const activeCls = i === curPage ? 'bg-white text-black font-bold' : 'bg-white/10 text-white/60 hover:bg-white/20 hover:text-white';
        html += `<button onclick="curPage=${i};render()" class="w-8 h-8 rounded-lg ${activeCls} transition flex items-center justify-center text-xs font-mono">${i}</button>`;
      }
      pager.innerHTML = html;
    }

    async function clearHistory() {
      if (!confirm('Are you sure you want to clear all history? This cannot be undone.')) return;
      await fetch('/api/history/clear', { method: 'POST' });
      _allItems = [];
      render();
    }

    async function dismissCaptcha() {
      document.getElementById('captcha-alert').classList.add('hidden');
      await fetch('/api/captcha/clear', { method: 'POST' });
    }

    loadData();
    setInterval(loadData, 5000);
  </script>
</body>

</html>
