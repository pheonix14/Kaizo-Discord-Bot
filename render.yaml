services:
  - type: web
    name: fafnir-engine
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main_headless.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
    healthCheckPath: /
