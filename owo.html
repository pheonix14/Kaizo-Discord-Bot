<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FAFNIR | Tokens Config</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #000;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass {
      background: rgba(10, 10, 10, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    input { 
      background: rgba(0,0,0,0.4); 
      border: 1px solid rgba(255,255,255,0.1); 
      color: #fff; outline: none; transition: 0.2s; 
    }
    input:focus { border-color: rgba(255,255,255,0.5); }
    ::-webkit-scrollbar { width: 0px; }
  </style>
</head>
<body class="flex flex-col h-screen">

  <div id="bg-overlay" class="absolute inset-0 bg-black/60 -z-10"></div>

  <nav class="glass px-6 py-4 flex items-center justify-between shrink-0 z-10 mx-4 mt-4 rounded-2xl">
    <div class="flex items-center gap-6 overflow-x-auto no-scrollbar w-full">
      <h1 class="text-xl font-bold tracking-tight shrink-0">FAFNIR</h1>
      <div class="flex gap-4">
        <a href="/" class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Home</a>
        <a href="/config" class="text-white font-medium text-sm whitespace-nowrap px-3 py-1 bg-white/10 rounded-full">Tokens</a>
        <a href="/history" class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">History</a>
        <a href="/owo" class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">OwO</a>
        <a href="/slash" class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Slash</a>
        <a href="/spam" class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Spam</a>
        <a href="/image" class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Image</a>
        <a href="/hook" class="text-white/60 hover:text-white transition-colors text-sm font-medium whitespace-nowrap">Hook</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 overflow-auto p-4 md:p-8 z-10 relative">
    <div class="max-w-4xl mx-auto flex flex-col gap-8">
      
      <!-- Add Token Form -->
      <div>
        <h2 class="text-xs uppercase tracking-widest text-white/50 mb-4 font-bold ml-2">Node Configuration</h2>
        <div class="glass rounded-3xl p-6 md:p-8 flex flex-col gap-5">
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Discord Token *</label>
            <input type="password" id="t" class="w-full px-5 py-3 rounded-2xl mono text-sm transition-colors" placeholder="User Token String">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div>
              <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Label</label>
              <input type="text" id="lb" class="w-full px-5 py-3 rounded-2xl text-sm transition-colors" placeholder="e.g. Main Account">
            </div>
            <div>
              <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Channel ID</label>
              <input type="text" id="ch" class="w-full px-5 py-3 rounded-2xl mono text-sm transition-colors" placeholder="Blank = Global Listen">
            </div>
            <div>
              <label class="block text-[10px] uppercase tracking-widest text-white/50 mb-2 font-bold ml-1">Guild ID</label>
              <input type="text" id="gi" class="w-full px-5 py-3 rounded-2xl mono text-sm transition-colors" placeholder="Blank = All Guilds">
            </div>
          </div>
          <button onclick="add()" class="mt-4 w-full md:w-auto self-start px-8 py-3 bg-white text-black hover:scale-105 active:scale-95 transition-transform rounded-2xl text-sm font-bold tracking-wide shadow-[0_0_20px_rgba(255,255,255,0.2)]">Add Node</button>
        </div>
      </div>

      <!-- Active Tokens List -->
      <div>
        <h2 class="text-xs uppercase tracking-widest text-white/50 mb-4 font-bold ml-2">Registered Nodes</h2>
        <div id="tlist" class="flex flex-col gap-4">
          <div class="text-sm text-white/50 text-center py-8">Loading nodes...</div>
        </div>
      </div>

    </div>
  </main>

  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-white/90 backdrop-blur-md text-black text-sm font-bold rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.5)] transition-all duration-300 transform translate-y-10 opacity-0 pointer-events-none z-50"></div>

  <script src="/static/luxury_theme.js"></script>
  <script>
    function toast(m, err=false) {
      const t = document.getElementById('toast');
      t.textContent = m;
      t.style.background = err ? 'rgba(239, 68, 68, 0.9)' : 'rgba(255, 255, 255, 0.9)';
      t.style.color = err ? '#fff' : '#000';
      t.classList.remove('translate-y-10', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-10', 'opacity-0'), 2500);
    }

    async function load() {
      const list = await fetch('/api/tokens').then(r => r.json());
      const el = document.getElementById('tlist');
      if (!list.length) {
        el.innerHTML = '<div class="glass rounded-3xl p-10 text-center text-sm font-medium text-white/50">No nodes registered. Provide a token to begin.</div>';
        return;
      }
      el.innerHTML = list.map(t => `
        <div class="glass rounded-3xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-5 group transition-all hover:bg-white/5 border border-white/5">
          <div class="flex items-center gap-4">
            <div class="w-3 h-3 rounded-full ${t.active?'bg-green-400 shadow-[0_0_10px_rgba(74,222,128,0.6)]':'bg-white/20'}"></div>
            <div>
              <div class="text-base font-bold text-white mb-1 tracking-wide">${t.label}</div>
              <div class="text-[10px] mono text-white/40 uppercase tracking-widest">${t.channel_id?'CH: '+t.channel_id:'Global Listen'} &middot; ${t.guild_id?'GU: '+t.guild_id:'All Guilds'}</div>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="tog('${t.id}')" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider border transition-all ${t.active?'bg-white/10 text-white border-white/20 hover:bg-white/20':'border-white/10 text-white/40 hover:text-white'}">
              ${t.active?'Standby':'Enable'}
            </button>
            <button onclick="del('${t.id}')" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider border border-red-500/30 text-red-400 hover:bg-red-500/20 transition-all">
              Remove
            </button>
          </div>
        </div>
      `).join('');
    }

    async function add() {
      const tok = document.getElementById('t').value.trim();
      if (!tok) { toast('Discord Token is required', true); return; }
      const r = await fetch('/api/tokens', {
        method: 'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          token: tok,
          label: document.getElementById('lb').value.trim(),
          channel_id: document.getElementById('ch').value.trim(),
          guild_id: document.getElementById('gi').value.trim()
        })
      });
      if (r.ok) {
        ['t','lb','ch','gi'].forEach(i => document.getElementById(i).value='');
        toast('Node Successfully Initialized');
        load();
      } else toast('Failed to initialize node', true);
    }

    async function tog(id) { await fetch('/api/tokens/'+id+'/toggle',{method:'POST'}); load(); }
    async function del(id) { if(confirm('Permanently remove this node?')) { await fetch('/api/tokens/'+id,{method:'DELETE'}); load(); } }
    
    load(); setInterval(load, 5000);
  </script>
</body>
</html>
